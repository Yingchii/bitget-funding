name: LINE 串接測試（一次性）

# 一次性測試：驗證「本機不開機、GitHub Actions 也能自己發 LINE」。
# 直接呼叫 donchian_report.push_line，走的是正式發報同一條路徑
# （沒有 LINE_TO 時會自動改用 broadcast）。測完可刪除本檔。
on:
  schedule:
    - cron: '30 11 20 8 *'   # 8/20 11:30 UTC（台灣 19:30），一年只會遇到一次
    - cron: '15 12 20 8 *'   # 備用班次 8/20 12:15 UTC（台灣 20:15），怕上面那班被跳過
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 發測試訊息
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python -c "
          import os
          from donchian_report import push_line
          how = '排程自動' if os.environ['TRIGGER'] == 'schedule' else '手動'
          push_line(
              '🔧 雲端串接測試（' + how + '觸發）\n'
              '這則訊息由 GitHub Actions 發出，不經過你的電腦。\n'
              '收到＝雲端→LINE 正常，關機時觸發通報與預警也會照發。')
          print('已發 LINE。')
          "
