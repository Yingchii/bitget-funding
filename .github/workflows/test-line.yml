name: LINE 串接測試（一次性）

# 一次性測試：2026-08-20 台灣 19:30（11:30 UTC）從雲端發 LINE，
# 驗證「本機不開機、GitHub Actions 也能自己發報」。
# 免費方案排程會延遲，實際可能 19:30~20:00 之間送達。測完可刪除本檔。
on:
  schedule:
    - cron: '30 11 20 8 *'   # 8/20 11:30 UTC，一年只會遇到一次
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 發測試訊息
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          curl -sS --fail-with-body -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"$LINE_TO\",\"messages\":[{\"type\":\"text\",\"text\":\"🔧 雲端排程串接測試（預定 19:30）\n這則訊息由 GitHub Actions 自動發出，不依賴你的電腦。\n收到＝雲端→LINE 串接正常，之後觸發通報與預警在你關機時也會照發。\"}]}"
