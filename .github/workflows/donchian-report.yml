name: 唐奇安觸發通報

# 每天收盤後檢查一次，但「只在訊號翻轉／需要動作時」才發 LINE（--only-action），
# 平常安靜。手動觸發則發完整日報。盤中觸線另由 donchian-intraday.yml 預警。
on:
  schedule:
    # 台灣時間約 09:15（01:15 UTC）檢查前一日收盤；免費方案排程會延遲。
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只印訊息內容，不發 LINE'
        type: boolean
        default: false

concurrency:
  group: donchian-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 算訊號並發 LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          POSITION_GIST_ID: ${{ secrets.POSITION_GIST_ID }}
        # 排程跑 --only-action（觸發才發）；手動觸發發完整日報
        run: >
          python donchian_report.py
          ${{ github.event_name == 'schedule' && '--only-action' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
