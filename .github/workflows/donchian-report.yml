name: 唐奇安日報（手動）

# 2026-08-20 起停用每日排程（交易頻率低，不需每天發報）。
# 模型狀態改併入本機雙週交易報告（trading-exec\trade_review.py）；
# 進出場觸線仍由 donchian-intraday.yml 即時預警。要看日報可手動觸發。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只印訊息內容，不發 LINE'
        type: boolean
        default: false

concurrency:
  group: donchian-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 算訊號並發 LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          POSITION_GIST_ID: ${{ secrets.POSITION_GIST_ID }}
        run: python donchian_report.py ${{ inputs.dry_run && '--dry-run' || '' }}
