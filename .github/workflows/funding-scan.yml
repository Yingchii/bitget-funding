name: Bitget 資費監控

on:
  schedule:
    # 每 2 小時掃一次。不用每小時的原因：
    # 免費方案的排程本來就會被延遲/跳過（實測平均就是 2 小時），
    # 設太密只會讓排隊中的 run 被下一次觸發擠掉而顯示 cancelled。
    # 資金費率 8 小時才結算一次，2 小時的解析度綽綽有餘。
    - cron: '5 */2 * * *'
  workflow_dispatch:        # 也可以在網頁上手動按一次
    inputs:
      test_notify:
        description: '只發一則 LINE 測試訊息驗證通道（不做掃描）'
        type: boolean
        default: false

# 避免上一輪還沒跑完就啟動下一輪，導致狀態檔打架
concurrency:
  group: funding-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      # 通報冷卻記錄要跨執行保留，否則每小時都會重複發同一檔
      - name: 還原通報狀態
        uses: actions/cache/restore@v6
        with:
          path: state
          key: funding-state-${{ github.run_id }}
          restore-keys: |
            funding-state-

      # 只在手動勾選時執行。刻意不吞錯誤：token 有問題就讓 job 變紅，
      # 這樣才驗證得出 GitHub Secret → 腳本 → LINE 整條鏈路
      - name: LINE 通道測試
        if: ${{ inputs.test_notify }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python bitget_funding_scan.py --test-notify

      - name: 掃描並通報
        if: ${{ ! inputs.test_notify }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          mkdir -p state
          python bitget_funding_scan.py \
            --notify --quiet \
            --cooldown-hours 12 \
            --state-file state/funding_state.json \
            --json state/latest.json

      # cache key 是不可變的，所以用 run_id 當 key、prefix 當 restore-keys
      - name: 保存通報狀態
        if: ${{ always() && ! inputs.test_notify }}
        uses: actions/cache/save@v6
        with:
          path: state
          key: funding-state-${{ github.run_id }}

      - name: 上傳掃描結果
        if: ${{ always() && ! inputs.test_notify }}
        uses: actions/upload-artifact@v7
        with:
          name: scan-result-${{ github.run_number }}
          path: state/latest.json
          retention-days: 7
          if-no-files-found: ignore
