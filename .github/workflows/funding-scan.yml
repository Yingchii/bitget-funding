name: Bitget 資費監控

on:
  schedule:
    # 每小時的第 5 分鐘掃一次（UTC，但這裡不看時區無所謂）
    # 想省 Actions 額度可改成每 2 小時： '5 */2 * * *'
    - cron: '5 * * * *'
  workflow_dispatch:        # 也可以在網頁上手動按一次

# 避免上一輪還沒跑完就啟動下一輪，導致狀態檔打架
concurrency:
  group: funding-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      # 通報冷卻記錄要跨執行保留，否則每小時都會重複發同一檔
      - name: 還原通報狀態
        uses: actions/cache/restore@v6
        with:
          path: state
          key: funding-state-${{ github.run_id }}
          restore-keys: |
            funding-state-

      - name: 掃描並通報
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          mkdir -p state
          python bitget_funding_scan.py \
            --notify --quiet \
            --cooldown-hours 12 \
            --state-file state/funding_state.json \
            --json state/latest.json

      # cache key 是不可變的，所以用 run_id 當 key、prefix 當 restore-keys
      - name: 保存通報狀態
        if: always()
        uses: actions/cache/save@v6
        with:
          path: state
          key: funding-state-${{ github.run_id }}

      - name: 上傳掃描結果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-result-${{ github.run_number }}
          path: state/latest.json
          retention-days: 7
          if-no-files-found: ignore
