name: 策略回測報告（手動）

# 不排程（使用者要的是追蹤自己的實際交易，見本機 trade_review.py 雙週報告）。
# 想看策略回測健檢時手動觸發即可。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只印報告內容，不發 LINE'
        type: boolean
        default: false

concurrency:
  group: weekly-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 回測並發 LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python weekly_backtest.py ${{ inputs.dry_run && '--dry-run' || '' }}
